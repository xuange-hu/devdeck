name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify tag matches package version
        shell: bash
        run: |
          node -e "const p=require('./package.json'); const t=process.env.GITHUB_REF_NAME.replace(/^v/,''); if(p.version!==t){ console.error('tag '+t+' != package '+p.version); process.exit(1); }"
      - run: npm run build
      - run: npm run build:exe
      - run: npm pack
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/devdeck.exe
            devdeck-cli-*.tgz
          generate_release_notes: true